name: dry-rs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dry-rs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.94.0"

      - name: Build dry-rs
        run: cargo build --release -p dry-rs --locked

      - name: Run structural duplication analysis
        run: |
          ./target/release/dry-rs \
            crates/dry-rs/src \
            crates/dry-core/src \
            --format both \
            --json-out dry-rs-report.json \
            --no-fail-on-findings

      - name: Upload JSON report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dry-rs-report
          path: dry-rs-report.json

      - name: Write step summary
        if: always()
        run: |
          {
            echo "## dry-rs"
            echo
            ./target/release/dry-rs \
              crates/dry-rs/src \
              crates/dry-core/src \
              --format text \
              --no-fail-on-findings
          } >> "$GITHUB_STEP_SUMMARY"
