[package]
name = "dry-ts"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Structural duplication detector for TypeScript source"
readme = "../../README.md"
repository = "https://github.com/deangrant/dry-score"
keywords = ["dry", "duplication", "clone-detection", "typescript"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "dry_ts"
path = "src/lib.rs"

[[bin]]
name = "dry-ts"
path = "src/main.rs"

[dependencies]
dry-core = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-typescript = { workspace = true }

[lints]
workspace = true
