# dry.example.toml — annotated sample configuration.

[gate]
# Minimum Jaccard similarity required to report a finding.
threshold = 0.85
# Exit with code 1 when any finding is reported.
fail_on_findings = false

[output]
# text | json | both
format = "text"

[walk]
# Extensions without a leading dot.
extensions = ["rs"]
# Directory name components to skip while walking (relative to each root).
# Setting this key replaces the default list entirely (it does not merge).
# `tests` is excluded by default; override exclude to scan integration-test duplication.
exclude = ["target", ".git", "fixtures", "tests"]
# Drop forms smaller than this structural node count.
min_nodes = 10
# Drop forms spanning fewer source lines than this.
min_lines = 3
# Skip source files larger than this many bytes (not read or normalized).
max_file_bytes = 2097152
